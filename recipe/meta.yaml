{% set name = "element-recognition" %}
{% set version = "1.1.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/element_recognition-{{ version }}.tar.gz
  sha256: c92b8024e86f0309ee79e4d310207d215bd79bd83645627680f20d4735c5f430

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - numpy
    - pandas
    - python >={{ python_min }}

test:
  imports:
    - element_recognition
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/yu9824/element_recognition/
  summary: You can get element ratio.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - yu9824
